<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt A - Opgave 6 - Martin Winther Clausen</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="/assets/favicon/WintherFavicon.png">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <section>
            <div class="flexContainer">
                <h1 class="flexTop">Word counter</h1>
                <div class="flexBottom">
                    <textarea name="input" id="input" placeholder="Go on, write something."></textarea>
                    <div>
                        <p>You've written:</p>
                        <ul>
                            <li><span id="wordCounter">0</span> word<span id="pluralWord"></span></li>
                            <li><span id="characterWSpaceCounter">0</span> character<span id="pluralcharacterWSpace"></span> with spaces</li>
                            <li><span id="characterWOSpaceCounter">0</span> character<span id="pluralcharacterWOSpace"></span> without spaces</li>
                            <li><span id="pageCounter">0</span> standard page<span id="pluralPage"></span></li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
